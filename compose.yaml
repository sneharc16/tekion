services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: battery_timeline
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - battery_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battery -d battery_timeline"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  battery_pg:
